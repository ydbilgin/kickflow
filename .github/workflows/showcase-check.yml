name: Showcase in sync

on:
  push:
    paths:
      - "README*.md"
      - "docs/showcase/**"
      - "docs/media/**"
      - "assets/**"
      - ".github/workflows/showcase-check.yml"
  pull_request:
    paths:
      - "README*.md"
      - "docs/showcase/**"
      - "docs/media/**"
      - "assets/**"
      - ".github/workflows/showcase-check.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: README blocks and art match docs/showcase/showcase.yml
        run: python3 docs/showcase/showcase.py --check
