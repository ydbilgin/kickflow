     scroller. Row content trimmed. In Turkish the span reads "kaydırırken sohbet duraklatıldı". -->
<div class="relative shrink grow overflow-hidden bg-surface-bg-lowest" id="chat-column">
  <!-- The pinned-message card is a second absolute child of the same column (captured live, kick.com/jahrein,
       2026-10-24; text and long svg paths trimmed). Its two icon buttons must never be taken for the pause pill. -->
  <div class="absolute w-full empty:hidden" style="padding-top: 6px; padding-bottom: 6px;">
    <div class="relative flex h-fit w-full flex-col gap-1.5" style="padding-left: 8px; padding-right: 8px;">
      <div data-testid="pinned-message-modal" class="z-absolute w-full">

          </div>
        </div>
