name: KickFlow
repo: ydbilgin/kickflow
tagline: Kick chat that keeps its context.
description: A Chrome extension that keeps deleted and timed-out messages readable, makes channel events easy to follow, and adds rewind, speed and capture controls to the Kick player.
icon: icons/icon-128.png
