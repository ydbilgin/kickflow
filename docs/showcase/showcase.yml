features:
  - name: Deleted messages stay
    text: "Messages KickFlow already received stay readable after a deletion: struck through and labelled *deleted*, with the moderator when Kick sends the name."
  - name: Bans and timeouts
    text: A banned or timed-out user's messages stay in place with a *banned* or *timeout 10m* style label, and a short moderator-action row says who did it.
  - name: Two chat views
    text: Use Kick's own chat with these additions, or switch to KickFlow's own chat list (as in the recording).
  - name: Readable events
    text: Subscriptions, gifted subs with an expandable list of recipients, Kicks gifts, hosts, raids and chat-mode changes as clear rows. Pins and polls stay with Kick.
  - name: Find and highlight
    text: Search this session's chat (Ctrl+F on the page), list one person's messages, follow a reply back to its message. Mentions, replies, moderators and VIPs can be highlighted in your own colours.
  - name: Player controls
    text: Back and forward 10 seconds (within the stream's buffer), back to live, automatic catch-up, playback speed, and the highest available quality.
  - name: Frame and clip capture
    text: Save the current frame as a PNG, or record the next 15 seconds of the picture as a local WebM clip with a preview before you save it.
  - name: Shortcuts
    text: "`Left` / `Right` seek, `L` goes live, `S` saves a frame, `Shift+S` records a clip. Each can be changed or turned off, and they do nothing while you type."
  - name: Optional extras
    text: Theater mode on open, a guard that keeps Kick's auto-captions from switching on by themselves, and two reward switches that click Kick's own claim buttons. Theater mode and both reward clicks are off by default.

