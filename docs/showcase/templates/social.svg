@out docs/media/social-preview.svg
@png docs/media/social-preview.png 1280x640
@wrap tagline chars=34 lines=2 line_height=40 top=408
@wrap social_blurb chars=48 lines=2 line_height=34 top=50
---
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0c0f11"/><stop offset="1" stop-color="#14181b"/></linearGradient>
  <radialGradient id="glow" cx="0.78" cy="0.45" r="0.55"><stop offset="0" stop-color="#53fc18" stop-opacity="0.16"/><stop offset="1" stop-color="#53fc18" stop-opacity="0"/></radialGradient>
  <clipPath id="shot"><rect x="760" y="57" width="450" height="525" rx="18"/></clipPath>
</defs>
<rect width="1280" height="640" fill="url(#bg)"/>
<rect width="1280" height="640" fill="url(#glow)"/>
<rect x="0" y="0" width="1280" height="8" fill="#53fc18"/>
<g font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <image href="{{icon_data|raw}}" x="84" y="150" width="104" height="104"/>
  <text x="84" y="350" font-size="84" font-weight="800" fill="#f2f5f3">{{name}}</text>
{{#tagline_lines}}
  <text x="86" y="{{y}}" font-size="34" font-weight="500" fill="#53fc18">{{text}}</text>
{{#last}}
  <g transform="translate(0 {{y}})">
{{#social_blurb_lines}}
  <text x="86" y="{{y}}" font-size="24" fill="#a9b3ad">{{text}}</text>
{{/social_blurb_lines}}
  <text x="86" y="150" font-size="22" font-weight="600" fill="#7f8a84">{{social_subtitle}} · github.com/{{repo}}</text>
  </g>
{{/last}}
{{/tagline_lines}}
</g>
<rect x="759" y="56" width="452" height="527" rx="19" fill="#000" fill-opacity="0.35" stroke="#2c3530" stroke-width="2"/>
<image href="data:image/png;base64," x="760" y="57" width="450" height="525" clip-path="url(#shot)" preserveAspectRatio="none"/>
</svg>
